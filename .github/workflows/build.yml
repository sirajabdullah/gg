name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          z=$(find . -iname "*PokerAI*.zip" -not -path "./.git/*" | head -n1)
          if [ -z "$z" ]; then echo "PokerAI zip not found in repo"; find . -not -path "./.git/*" | head -50; exit 1; fi
          echo "Using $z"
          unzip -o "$z" -d .
          ls PokerAI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make sure Android SDK 34 is present (runner already has an SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Put API key into Config.kt (from GitHub secret)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          sed -i "s|const val KEY = \"\"|const val KEY = \"${GEMINI_KEY}\"|" PokerAI/app/src/main/java/com/example/pokerai/Config.kt
      - name: Build debug APK
        working-directory: PokerAI
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI-apk
          path: PokerAI/app/build/outputs/apk/debug/app-debug.apk
